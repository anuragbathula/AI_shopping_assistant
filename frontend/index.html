<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopMate Assistant</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="app">
    <header><p class="eyebrow">SHOPMATE</p><h1>Your shopping assistant</h1><p>Search products or check an order in a few words.</p></header>
    <section class="suggestions" aria-label="Suggestions"><button>Show Nike t-shirts</button><button>Show laptops under $1000</button><button>Track order 1234</button><button>When will order 5678 arrive?</button></section>
    <section id="chat" class="chat" aria-live="polite" aria-label="Shopping assistant messages">
      <article class="message assistant">Hi! I can help find products or check an order. What would you like to do?</article>
    </section>
    <form id="chat-form" class="composer"><label for="message">Your message</label><div><input id="message" autocomplete="off" placeholder="Try “Show Nike t-shirts”" required><button type="submit">Send</button></div><p id="status" role="status"></p></form>
  </main>
  <script src="app.js"></script>
</body>
</html>
